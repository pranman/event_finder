# ──────────────────────────────────────────────
# Instant-alert settings (fast poll path)
# ──────────────────────────────────────────────
alerts:
  enabled: true
  worth_threshold: 0.55       # min relevance score to consider alerting
  urgency_threshold: 0.6      # min urgency score to trigger instant alert
  max_alerts_per_day: 2       # daily cap — extras queue into Thursday digest
  fast_poll_cron: "0 9 * * *" # daily 9 AM
  # Only these sources run on the fast path (others are weekly-only):
  fast_sources:
    - instagram:wellnessto.events
    - luma_hosts
    - meetup

# Keywords that boost urgency score (checked against title + description)
urgency_keywords:
  - limited
  - "limited spots"
  - "spots left"
  - rsvp
  - "first come"
  - "sign up"
  - "register now"
  - "filling up"
  - "almost full"

# Path to the persistent seen-events state store
state_path: ./state/seen_events.json

# Number of days ahead to fetch events
lookahead_days: 10

# Minimum relevance score to include in digest (0.0 - 1.0)
min_relevance_score: 0.1

# Max events per category in the digest
max_events_per_category: 10
