[project]
name = "event-finder"
version = "0.1.0"
description = "A configurable city event catalogue with scheduled source imports."
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=5.2,<5.3",
    "django-tailwind>=4.5,<5",
    "python-dotenv>=1,<2",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.7,<3",
    "icalendar>=6,<8",
    "recurring-ical-events>=3,<4",
]

[project.optional-dependencies]
legacy = [
    "mcp>=1,<2", "fastmcp>=2,<3", "httpx[http2]>=0.27,<1",
    "lxml>=5,<7", "pydantic-settings>=2.3,<3", "pyyaml>=6,<7",
    "openai>=1.30,<3", "jinja2>=3.1,<4", "praw>=7.7,<8",
    "instaloader>=4.10,<5", "APScheduler>=3.10,<4", "rich>=13.7,<15", "typer>=0.12,<1",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.21,<2",
    "playwright>=1.58,<2",
    "pytest>=8.2,<10", "pytest-asyncio>=0.23,<2", "pytest-django>=4.9,<5",
    "pytest-mock>=3.14,<4", "respx>=0.21,<1", "freezegun>=1.5,<2", "pytest-cov>=5,<8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
]

[tool.coverage.run]
source = ["scrapers", "core", "email_digest", "models"]
omit = ["tests/*", "scheduler/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
