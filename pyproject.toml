[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-v",
]

[tool.coverage.run]
source = ["scrapers", "core", "email_digest", "models"]
omit = ["tests/*", "scheduler/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
