name: Weekly Digest + Daily Fast Poll

on:
  schedule:
    - cron: "0 8 * * 4"   # Thursday 8 AM UTC — weekly digest
    - cron: "0 9 * * *"   # Daily 9 AM UTC — fast poll (instant alerts)
  workflow_dispatch:       # allows manual trigger from GitHub UI

jobs:
  weekly-digest:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 8')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly digest
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EVENTBRITE_API_KEY: ${{ secrets.EVENTBRITE_API_KEY }}
          MEETUP_API_KEY: ${{ secrets.MEETUP_API_KEY }}
          SONGKICK_API_KEY: ${{ secrets.SONGKICK_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "events_finder/1.0"
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python server.py --send

  fast-poll:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.schedule, '0 9')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast poll
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          MEETUP_API_KEY: ${{ secrets.MEETUP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python server.py --fast-poll
